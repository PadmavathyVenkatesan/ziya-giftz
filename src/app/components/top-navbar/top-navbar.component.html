<div class="top-navbar">
  <!-- Logo and brand area -->
  <div class="brand-section">
    <a routerLink="/" class="logo-container">
      <img src="assets/logos/padma-giftz-logo.svg" alt="Padma Giftz" class="logo">
    </a>
  </div>

  <!-- Search Area -->
  <div class="search-box">
    <input type="text" placeholder="Search for gifts..." [formControl]="searchControl">
    <button class="search-btn" (click)="search(searchControl.value || '')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    </button>
  </div>

  <!-- Wishlist Icon -->
  <div class="wishlist-icon" (click)="navigateTo('wishlist')">
    <div class="wishlist-icon-container">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
      <!-- Force visible badge for debugging -->
      <div class="wishlist-badge debug-visible" [title]="'Wishlist count: ' + wishlistItemCount">
        {{ wishlistItemCount }}
      </div>
    </div>
  </div>

</div>
