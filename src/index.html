  <!-- Emergency CSS text removal script -->
  <script>
    // Immediately remove CSS text when DOM loads
    document.addEventListener('DOMContentLoaded', function() {
      function removeCSSText() {
        // Remove any text content that contains CSS
        const body = document.body;
        if (body && body.innerText) {
          const textContent = body.innerText;
          if (textContent.includes('background: #FF0000') ||
              textContent.includes('.whatsapp-icon') ||
              textContent.includes('background-color: #25D366')) {

            // Find all text nodes
            const walker = document.createTreeWalker(
              document.body,
              NodeFilter.SHOW_TEXT,
              null,
              false
            );

            const textNodes = [];
            let node;
            while (node = walker.nextNode()) {
              const text = node.textContent || '';
              if (text.includes('background: #FF0000') ||
                  text.includes('.whatsapp-icon') ||
                  text.includes('background-color: #25D366') ||
                  text.includes('} .whatsapp-icon {')) {
                textNodes.push(node);
              }
            }

            textNodes.forEach(node => {
              if (node.parentNode) {
                node.parentNode.removeChild(node);
              }
            });
          }
        }
      }

      // Run immediately and then every 500ms for 10 seconds
      removeCSSText();
      let count = 0;
      const interval = setInterval(() => {
        removeCSSText();
        count++;
        if (count > 20) clearInterval(interval);
      }, 500);
    });
  </script>
