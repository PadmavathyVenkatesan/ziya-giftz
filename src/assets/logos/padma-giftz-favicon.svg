<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6739B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#faviconGradient)" stroke="#fff" stroke-width="2"/>
  
  <!-- Gift box -->
  <g transform="translate(8, 8)">
    <!-- Box -->
    <rect x="0" y="6" width="16" height="12" fill="#FFD700" rx="1"/>
    <!-- Ribbon vertical -->
    <rect x="6" y="2" width="4" height="16" fill="#FF6B6B"/>
    <!-- Ribbon horizontal -->
    <rect x="-2" y="10" width="20" height="4" fill="#FF6B6B"/>
    <!-- Bow -->
    <circle cx="8" cy="4" r="2" fill="#E53E3E"/>
  </g>
  
  <!-- Letter P -->
  <text x="16" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">P</text>
</svg>
